<main>
  <!-- #SIDEBAR (Sticky Profile Card on Desktop, Collapsible on Mobile) -->
  <aside class="sidebar" [class.active]="sidebarActive">
    <div class="sidebar-info">
      <figure class="avatar-box">
        <img src="assets/profile.png" [alt]="ps.name" width="80" height="80">
      </figure>

      <div class="info-content">
        <h1 class="name" [title]="ps.name">{{ ps.shortName }}</h1>
        <p class="title">{{ ps.titles[0] }}</p>
      </div>

      <button class="info_more-btn" (click)="toggleSidebar()" aria-label="Toggle contact details">
        <span>Show Contacts</span>
        <i class="fas fa-chevron-down"></i>
      </button>
    </div>

    <div class="sidebar-info_more">
      <div class="separator"></div>

      <ul class="contacts-list">
        <li class="contact-item" (click)="ps.copyContactInfo(ps.email, 'Email Address')" style="cursor: pointer;" title="Click to copy Email">
          <div class="icon-box">
            <i class="fas fa-envelope"></i>
          </div>
          <div class="contact-info">
            <p class="contact-title">Email <i class="fas fa-copy" style="font-size: 10px; margin-left: 4px; color: var(--accent-color);"></i></p>
            <a [href]="'mailto:' + ps.email" class="contact-link" (click)="$event.stopPropagation()">{{ ps.email }}</a>
          </div>
        </li>

        <li class="contact-item" (click)="ps.copyContactInfo(ps.phone, 'Phone Number')" style="cursor: pointer;" title="Click to copy Phone">
          <div class="icon-box">
            <i class="fas fa-phone-alt"></i>
          </div>
          <div class="contact-info">
            <p class="contact-title">Phone <i class="fas fa-copy" style="font-size: 10px; margin-left: 4px; color: var(--accent-color);"></i></p>
            <a [href]="'tel:' + ps.phone" class="contact-link" (click)="$event.stopPropagation()">{{ ps.phone }}</a>
          </div>
        </li>

        <li class="contact-item">
          <div class="icon-box">
            <i class="fas fa-calendar-alt"></i>
          </div>
          <div class="contact-info">
            <p class="contact-title">Experience</p>
            <time>{{ ps.yearsExp }}</time>
          </div>
        </li>

        <li class="contact-item">
          <div class="icon-box">
            <i class="fas fa-map-marker-alt"></i>
          </div>
          <div class="contact-info">
            <p class="contact-title">Location</p>
            <address>{{ ps.location }}</address>
          </div>
        </li>
      </ul>

      <div class="separator"></div>

      <ul class="social-list">
        <li *ngFor="let social of ps.socialLinks" class="social-item">
          <a [href]="social.url" target="_blank" rel="noopener noreferrer" class="social-link" [title]="social.label">
            <i [class]="social.icon"></i>
          </a>
        </li>
      </ul>
    </div>
  </aside>

  <!-- #MAIN-CONTENT (Top Tab Navbar + Active Section Articles + Global Footer) -->
  <div class="main-content">
    <app-navbar></app-navbar>

    <!-- Section Components (Each component's root <article> binds [class.active]) -->
    <app-about></app-about>
    <app-experience></app-experience>
    <app-projects></app-projects>
    <app-architecture-showcase></app-architecture-showcase>
    <app-contact></app-contact>

    <!-- Global Footer -->
    <app-footer></app-footer>
  </div>
</main>

<!-- Preferences Drawer / Settings Modal -->
<app-settings-panel></app-settings-panel>

<!-- Floating Copy Toast Notification -->
<div *ngIf="ps.toastMessage()" class="floating-toast" style="position: fixed; bottom: 30px; right: 30px; background: rgba(24, 24, 28, 0.95); border: 1px solid var(--accent-color); color: var(--text-primary); padding: 12px 22px; border-radius: 12px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); backdrop-filter: blur(12px); z-index: 9999; animation: slideUpToast 0.3s cubic-bezier(0.16, 1, 0.3, 1);">
  <i class="fas fa-check-circle" style="color: #10b981; font-size: 16px;"></i>
  <span>{{ ps.toastMessage() }}</span>
</div>
