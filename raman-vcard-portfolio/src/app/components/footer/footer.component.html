<footer class="footer">
  <div class="footer-inner">
    <div class="footer-left">
      <div class="footer-logo">
        <i class="fas fa-code" style="color: var(--accent-color);"></i>
        <span style="font-weight: 600; color: var(--text-primary); margin-left: 6px;">Ramanjaneyulu Boya</span>
      </div>
      <p class="footer-tagline" style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">
        Java Full Stack Developer · Spring Boot · Microservices · Angular · PostgreSQL
      </p>
    </div>

    <div class="footer-right">
      <div class="footer-socials" style="display: flex; gap: 12px; justify-content: center; margin-bottom: 8px;">
        <a
          *ngFor="let link of ps.socialLinks"
          [href]="link.url"
          [title]="link.label"
          target="_blank"
          rel="noopener noreferrer"
          class="footer-social"
          style="color: var(--text-muted); font-size: 16px; padding: 6px;"
        >
          <i [class]="link.icon"></i>
        </a>
      </div>
      <p class="footer-copy" style="font-size: 12px; color: var(--text-muted);">
        © 2025 Ramanjaneyulu Boya. All rights reserved.
      </p>
    </div>
  </div>
</footer>
