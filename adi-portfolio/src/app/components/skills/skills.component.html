<section id="skills" class="section-wrapper">
  <div class="section-container">
    <!-- Header -->
    <div class="section-header" data-aos="fade-up">
      <span class="section-tag">Technical Competencies</span>
      <h2 class="section-title">Full Stack <span class="accent-text">Skills Matrix</span></h2>
      <p class="section-sub">Production expertise across modern Java microservice ecosystems, frontends, and cloud databases.</p>
      <div class="title-line"></div>
    </div>

    <!-- Category Filter Tabs -->
    <div class="skill-tabs">
      <button
        *ngFor="let cat of categories"
        class="skill-tab"
        [class.active]="activeCategory === cat"
        (click)="setCategory(cat)"
      >
        {{ cat }}
      </button>
    </div>

    <!-- Skill Groups Grid - Clean Glass Technology Pills (No Percentage Bars/Lines) -->
    <div class="skills-group-grid">
      <div class="skill-group-card glass-card" *ngFor="let group of filteredSkills">
        <div class="group-header">
          <div class="group-icon" [style.color]="group.color" [style.background]="group.color + '15'">
            <i [class]="group.icon"></i>
          </div>
          <h3>{{ group.category }}</h3>
        </div>

        <div class="skill-items-grid">
          <div class="skill-pill-card" *ngFor="let skill of group.items">
            <div class="pill-top">
              <i class="fas fa-check-circle pill-check" [style.color]="group.color"></i>
              <span class="skill-name">{{ skill.name }}</span>
            </div>

            <div class="pill-meta">
              <span class="skill-tag-sub">{{ skill.tag }}</span>
              <span class="skill-badge-level" [style.background]="group.color + '20'" [style.color]="group.color">
                {{ skill.badge }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
