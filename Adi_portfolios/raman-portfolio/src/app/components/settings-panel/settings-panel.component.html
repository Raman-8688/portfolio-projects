<!-- Settings Backdrop Overlay -->
<div
  class="overlay"
  *ngIf="ps.settingsPanelOpen()"
  (click)="ps.toggleSettings()"
></div>

<!-- Settings Panel Drawer -->
<div
  class="settings-panel"
  [class.open]="ps.settingsPanelOpen()"
  [class.dark]="ps.isDarkMode()"
>
  <div class="panel-header">
    <div class="panel-title">
      <i class="fas fa-sliders-h"></i>
      <span>Portfolio Preferences</span>
    </div>
    <button class="close-btn" (click)="ps.toggleSettings()" aria-label="Close preferences">
      <i class="fas fa-times"></i>
    </button>
  </div>

  <!-- THEME COLOR ACCENT -->
  <div class="panel-section">
    <div class="panel-section-label">Accent Color</div>
    <div class="color-grid">
      <button
        *ngFor="let color of themeColors"
        class="color-swatch"
        [style.background]="color"
        [class.selected]="ps.themeColor() === color"
        (click)="ps.setThemeColor(color)"
        [attr.aria-label]="'Select accent color ' + color"
      >
        <i class="fas fa-check" *ngIf="ps.themeColor() === color"></i>
      </button>
    </div>
  </div>

  <!-- DARK / LIGHT MODE -->
  <div class="panel-section">
    <div class="panel-section-label">Appearance</div>
    <div class="toggle-row" (click)="ps.toggleDarkMode()" role="button" tabindex="0">
      <div class="toggle-info">
        <i [class]="ps.isDarkMode() ? 'fas fa-moon' : 'fas fa-sun'"></i>
        <span>{{ ps.isDarkMode() ? "Dark Mode" : "Light Mode" }}</span>
      </div>
      <div class="toggle-switch" [class.on]="ps.isDarkMode()">
        <div class="toggle-knob"></div>
      </div>
    </div>
  </div>

  <!-- QUICK NAVIGATION (Canonical Source of Truth) -->
  <div class="panel-section">
    <div class="panel-section-label">Quick Navigation</div>
    <div class="nav-list">
      <button
        *ngFor="let item of navItems"
        class="nav-item"
        [class.active]="ps.activeSection() === item.id"
        (click)="navigate(item.id)"
      >
        <i [class]="item.icon"></i>
        <span>{{ item.label }}</span>
      </button>
    </div>
  </div>
</div>
