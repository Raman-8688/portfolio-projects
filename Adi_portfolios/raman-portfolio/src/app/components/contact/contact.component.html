<article class="contact" [class.active]="ps.activeSection() === 'contact'" id="section-contact">
  <header>
    <h2 class="h2 article-title">Contact</h2>
  </header>

  <!-- Google Map Location Embed -->
  <section class="mapbox">
    <figure>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d123533.2504886653!2d78.0125866!3d15.8281257!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bb5e02422eb72f1%3A0x67db238128c7c97!2sKurnool%2C%20Andhra%20Pradesh!5e0!3m2!1sen!2sin!4v1711000000000!5m2!1sen!2sin"
        width="100%"
        height="100%"
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade"
        title="Location Map"
      ></iframe>
    </figure>
  </section>

  <!-- Contact Form -->
  <section class="contact-form">
    <h3 class="h3 form-title">Contact Form</h3>

    <form (submit)="onSubmit($event)" class="form">
      <div class="input-wrapper">
        <input
          type="text"
          name="fullname"
          class="form-input"
          placeholder="Full name"
          [(ngModel)]="form.name"
          required
          aria-label="Full name"
        />

        <input
          type="email"
          name="email"
          class="form-input"
          placeholder="Email address"
          [(ngModel)]="form.email"
          required
          aria-label="Email address"
        />
      </div>

      <textarea
        name="message"
        class="form-input"
        placeholder="Your Message"
        [(ngModel)]="form.message"
        required
        aria-label="Your Message"
      ></textarea>

      <button class="form-btn" type="submit" [disabled]="!isFormValid() || sending">
        <i class="fas fa-paper-plane"></i>
        <span>{{ sending ? 'Sending...' : 'Send Message' }}</span>
      </button>

      <div *ngIf="formSuccess" style="margin-top: 15px; color: var(--accent-color); font-size: 14px;">
        <i class="fas fa-check-circle"></i> Thank you! Your message has been sent successfully.
      </div>
    </form>
  </section>
</article>
